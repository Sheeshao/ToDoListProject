<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrackMyProgess</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

</head>

<body>
    <div class="content">
        <nav>
            <div class="navigation_content">
                <div class="navigation_brand">
                    <img src="/resource/remcheckloog.png" alt="ToDoLIST">
                    <h1>ToDoList</h1>
                </div>
                <div class="navigatio_menu">
                    <ul>
                        <a href="#">My Tasks</a>
                        <a href="#">Projects</a>
                        <a href="#">Calendar</a>
                        <a href="#">Reports</a>
                    </ul>
                </div>
                <div class="navigation_search">
                    <input type="text" placeholder="Search task..">
                    <span class="material-symbols-outlined">add</span>
                    <span class="material-symbols-outlined">notifications</span>
                    <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png " alt="Account logo">
                </div>
            </div>
        </nav>
        <aside>
            <div class="aside_content">
                <div class="item_list_container">
                    <div class="item_today_container">
                        <span class="material-symbols-outlined">calendar_month</span>
                        <div class="item_today_text">
                            <h3>Today</h3>
                            <p>Monday, Dec 25</p>
                        </div>
                        <div class="item_today_notifnumber">
                            <h1>5</h1>
                        </div>
                    </div>

                    <div class="item_today_container">
                        <span class="material-symbols-outlined">calendar_month</span>
                        <div class="item_today_text">
                            <h3>Inbox</h3>
                        </div>
                        <div class="item_today_notifnumber">
                            <h1>5</h1>
                        </div>
                    </div>

                    <div class="item_upcoming_container">
                        <span class="material-symbols-outlined">
                            calendar_clock
                        </span>
                        <div class="item_upcoming_text">
                            <h3>Upcoming</h3>
                        </div>
                        <div class="item_upcoming_notifnumber">
                            <h1>5</h1>
                        </div>
                    </div>

                    <div class="item_important_container">
                        <span class="material-symbols-outlined">
                            star
                        </span>
                        <div class="item_important_text">
                            <h3>Important</h3>
                        </div>
                        <div class="item_important_notifnumber">
                            <h1>5</h1>
                        </div>
                    </div>

                </div>

                <div class="project">
                    <h3>PROJECTS</h3>
                </div>

                <ul class="project_list_container">
                    <li>
                        <span class="dot_task1"></span>
                        <span class="text">Task1: this is task1</span>
                        <span class="count">8</span>
                    </li>
                    <li>
                        <span class="dot_task2"></span>
                        <span class="text">Task2</span>
                        <span class="count">8</span>
                    </li>
                </ul>

                <div class="add_task">
                    <span class="material-symbols-outlined">
                        add_task
                    </span>
                    <h3>Add Project</h3>
                </div>

            </div>
        </aside>
        <main>
            <section class="main_content">
                <div class="main_content_view">
                    <div class="main_content_header">
                        <h1 onclick="">Add a task</h1>
                        <button class="mc_add_task">
                            <span class="material-symbols-outlined">
                                add
                            </span>
                            <p>Add Task</p>
                        </button>

                    </div>
                    <div class="user_addtask_form">
                        <input type="text" id= "nameTask" placeholder="What task needed to complete??">
                        <input type="date" placeholder="Due date of task">
                        <textarea type="text" placeholder="Description of the task"></textarea>
                    </div>
                </div>
            </section>
        </main>
        <footer>
            <h1>FOOTER</h1>
        </footer>
    </div>

    <script src="todo.js"></script>
</body>

</html>
